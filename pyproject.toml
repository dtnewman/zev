[project]
name = "zev"
version = "0.12.1"
description = "Lookup CLI commands easily"
readme = "README.md"
dependencies = [
  "questionary>=2.1.1",
  "rich>=15.0.0",
]
requires-python = ">=3.10"
urls = { Repository = "https://github.com/dtnewman/zev" }

[project.scripts]
zev = "zev.main:app"

[project.optional-dependencies]
dev = ["ruff>=0.17.6", "isort>=9.0.2"]
azure = ["azure-identity>=1.27.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zev*"]

[tool.ruff]
line-length = 120
# this ensures imports are properly sorted
lint.select = ["I001"]

[tool.isort]
profile = "black"
line_length = 120
